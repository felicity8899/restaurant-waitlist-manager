name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  # -----------------------------------------------------------------
  # Parallel Unit Test Execution Stage
  # -----------------------------------------------------------------
  test-backend:
    name: Run Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        run: |
          cd backend
          DATABASE_URL=sqlite:// PYTHONPATH=. pytest

  test-frontend:
    name: Run Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test

  # -----------------------------------------------------------------
  # Integration and End-to-End Test Stage (Docker Compose)
  # -----------------------------------------------------------------
  e2e-tests:
    name: Run Containerized Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Script Dependencies
        run: |
          pip install httpx websockets

      - name: Run End-to-End Tests against Compose Stack
        run: |
          make e2e

  # -----------------------------------------------------------------
  # Secure Deployment and Health Validation Stage
  # -----------------------------------------------------------------
  deploy:
    name: Build, Deploy to AWS via OIDC & Validate Health
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    # Deploy only on pushes to main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      AWS_REGION: us-east-1
      ROLE_TO_ASSUME: arn:aws:iam::123456789012:role/github-oidc-role # Fallback placeholder; best is configuring secret
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Set up QEMU (For Multi-architecture builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Push, Deploy and Validate Health
        run: |
          ./scripts/deploy_aws.sh
